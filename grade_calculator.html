<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고교 과목별 성적 및 등급 계산 시뮬레이터</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #64748b;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            align-items: end;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 43px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #ef4444;
            padding: 6px 12px;
            font-size: 14px;
            height: auto;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-full {
            width: 100%;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #475569;
        }

        td {
            color: #334155;
        }

        .empty-row {
            color: #94a3b8;
            font-style: italic;
        }

        .result-box {
            text-align: center;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .result-item h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            opacity: 0.9;
        }

        .result-item .value {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>고교 성적 및 등급 계산기</h1>
        <p>과목별 이수 단위와 점수를 입력하여 가중 평균과 예상 등급을 확인하세요.</p>
    </header>

    <!-- 입력 폼 카드 -->
    <div class="card">
        <h3>과목 추가</h3>
        <div class="form-grid">
            <div class="input-group">
                <label for="subjectName">과목명</label>
                <input type="text" id="subjectName" placeholder="예: 수학Ⅰ">
            </div>
            <div class="input-group">
                <label for="unitCount">이수 단위</label>
                <input type="number" id="unitCount" min="1" max="10" value="3">
            </div>
            <div class="input-group">
                <label for="score">원점수</label>
                <input type="number" id="score" min="0" max="100" placeholder="예: 85">
            </div>
            <button class="btn" onclick="addSubject()">과목 추가</button>
        </div>
    </div>

    <!-- 과목 목록 테이블 카드 -->
    <div class="card">
        <h3>입력된 과목 목록</h3>
        <table>
            <thead>
                <tr>
                    <th>과목명</th>
                    <th>이수 단위</th>
                    <th>원점수</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="subjectTableBody">
                <tr>
                    <td colspan="4" class="empty-row">등록된 과목이 없습니다. 과목을 추가해주세요.</td>
                </tr>
            </tbody>
        </table>
        <button class="btn btn-full" onclick="calculateGrades()">전체 성적 계산</button>
    </div>

    <!-- 결과 출력 카드 -->
    <div class="card result-box" id="resultCard" style="display: none;">
        <h2 style="margin-top: 0; margin-bottom: 10px;">📊 성적 산출 결과</h2>
        <div class="result-grid">
            <div class="result-item">
                <h3>가중 평균 점수</h3>
                <p class="value" id="avgScore">0.00점</p>
            </div>
            <div class="result-item">
                <h3>예상 총평 등급</h3>
                <p class="value" id="totalGrade">-</p>
            </div>
        </div>
    </div>
</div>

<script>
    let subjects = [];

    // 과목 추가 함수
    function addSubject() {
        const nameInput = document.getElementById('subjectName');
        const unitInput = document.getElementById('unitCount');
        const scoreInput = document.getElementById('score');

        const name = nameInput.value.trim();
        const unit = parseInt(unitInput.value);
        const score = parseFloat(scoreInput.value);

        // 유효성 검사
        if (!name) {
            alert('과목명을 입력해주세요.');
            nameInput.focus();
            return;
        }
        if (isNaN(unit) || unit <= 0) {
            alert('올바른 이수 단위를 입력해주세요.');
            unitInput.focus();
            return;
        }
        if (isNaN(score) || score < 0 || score > 100) {
            alert('올바른 원점수(0~100)를 입력해주세요.');
            scoreInput.focus();
            return;
        }

        // 배열에 추가
        subjects.push({ name, unit, score });

        // 입력창 초기화
        nameInput.value = '';
        unitInput.value = '3';
        scoreInput.value = '';
        nameInput.focus();

        renderTable();
    }

    // 과목 삭제 함수
    function deleteSubject(index) {
        subjects.splice(index, 1);
        renderTable();
        if (subjects.length === 0) {
            document.getElementById('resultCard').style.display = 'none';
        }
    }

    // 테이블 렌더링 함수
    function renderTable() {
        const tbody = document.getElementById('subjectTableBody');
        tbody.innerHTML = '';

        if (subjects.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-row">등록된 과목이 없습니다. 과목을 추가해주세요.</td></tr>`;
            return;
        }

        subjects.forEach((subj, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${subj.name}</td>
                <td>${subj.unit}단위</td>
                <td>${subj.score}점</td>
                <td><button class="btn btn-danger" onclick="deleteSubject(${index})">삭제</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    // 전체 성적 및 등급 계산 함수
    function calculateGrades() {
        if (subjects.length === 0) {
            alert('계산할 과목이 없습니다. 먼저 과목을 추가해주세요.');
            return;
        }

        let totalScoreUnits = 0;
        let totalUnits = 0;

        subjects.forEach(subj => {
            totalScoreUnits += (subj.score * subj.unit);
            totalUnits += subj.unit;
        });

        const weightedAverage = totalScoreUnits / totalUnits;
        const grade = getGrade(weightedAverage);

        // 결과 화면에 반영
        document.getElementById('avgScore').innerText = weightedAverage.toFixed(2) + '점';
        document.getElementById('totalGrade').innerText = grade;
        document.getElementById('resultCard').style.display = 'block';
        
        // 부드럽게 결과로 스크롤
        document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
    }

    // 평균 점수에 따른 등급 산출 기준 (예시 기준)
    function getGrade(score) {
        if (score >= 90) return 'A등급 (1등급대)';
        if (score >= 80) return 'B등급 (2~3등급)';
        if (score >= 70) return 'C등급 (4~5등급)';
        if (score >= 60) return 'D등급 (6~7등급)';
        return 'E등급 (8~9등급)';
    }
</script>

</body>
</html>
